name: Check cask automation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s automation/tests -v
      - run: bash -n automation/publish.sh
      - run: for cask in Casks/*.rb; do ruby -c "$cask"; done
